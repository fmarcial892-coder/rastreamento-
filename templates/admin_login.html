<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acesso administrativo</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><main class="page narrow"><section class="panel login-card"><div class="hero-icon">⌁</div><h1>Acesso administrativo</h1><p class="panel-copy">Entre para gerenciar pedidos e atualizar status.</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post"><label for="username">Usuário</label><input id="username" name="username" autocomplete="username" required><label for="password">Senha</label><input id="password" type="password" name="password" autocomplete="current-password" required><button type="submit">Entrar</button></form><p class="back"><a href="/">Voltar para a consulta</a></p></section></main></body></html>
